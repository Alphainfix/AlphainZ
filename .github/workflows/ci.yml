name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# The plugin lives in plugin/; the repository root holds only the README, docs and licence.
defaults:
  run:
    working-directory: plugin

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Typecheck CLI
        run: npm run typecheck:cli

      - name: Typecheck agent-core
        run: npm run typecheck:core

      - name: Typecheck agent-ui
        run: npm run typecheck:ui

      - name: Typecheck agent-llm
        run: npm run typecheck:llm

      - name: Lint
        run: npx eslint .

      - name: Unit tests
        run: npm test
